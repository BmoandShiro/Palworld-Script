# Copy to the Steam Deck as /home/deck/.config/palworld-wg.conf
# (or leave next to the scripts and set PALWORLD_WG_CONF)

# Must match the NetworkManager connection name exactly
# (see README: nmcli connection rename ...)
WG_CONNECTION=palworld-wg

# Relay / WireGuard host IP (AllowedIPs target)
WG_HOST=10.8.0.1

# How long to wait for the tunnel / host after bring-up
WAIT_SECONDS=30
